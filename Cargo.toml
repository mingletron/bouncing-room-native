[package]
name = "bouncing-room-native"
version = "0.1.0"
edition = "2024"
# Two binaries live here; plain `cargo run` means the app, not the probe.
default-run = "bouncing-room"

[lib]
name = "bouncing_room_native"
path = "src/lib.rs"

[[bin]]
name = "bouncing-room"
path = "src/main.rs"

# The offscreen render probe: renders a frame headlessly, writes a PNG, and
# checks that the bodies inside the room are actually visible (see the note on
# `GfxOptions::room_front_face`).
[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
# `default_fonts` must be requested explicitly: egui 0.37's `default` feature is
# empty and it depends on epaint with `default-features = false`, so without this
# the font atlas has no glyphs and every character draws as the missing-glyph box.
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = "0.37.0"
egui-winit = "0.37.0"
glam = { version = "0.34.3", features = ["bytemuck"] }
pollster = "1.0.1"
wgpu = "30.0.1"
winit = "0.30.13"

# Used by the offscreen render probe (src/bin/probe.rs) so the native port can
# be checked the way the browser probe checks the WebGL build.
png = "0.18.1"
# The Wavefront reader for `src/import.rs`. Chosen over hand-rolling because the
# parts of OBJ that go wrong quietly are exactly the ones this avoids having to
# get right: the four face-element index forms (`v`, `v/vt`, `v//vn`, `v/vt/vn`),
# negative indices that count back from the last declared vertex, and fanning
# polygons of arbitrary arity into the triangles the renderer draws. Everything
# that is *not* parsing — welding, normalising, the u16 index budget — is here.
tobj = "4.0.5"
# glTF 2.0, text and binary. Without its default features: those decode
# textures, and this renderer has no texture coordinates to put one on, so the
# image stack would be dead weight. Buffers are read in `src/import.rs`.
gltf = { version = "1.4", default-features = false, features = ["utils"] }
# The system file dialog. On Linux it talks to the desktop portal, so there is
# no GTK to link against and it works under Wayland, where winit delivers no
# file drops.
rfd = "0.18"
# Recorded clips (`src/record.rs`). GIF because it plays everywhere a README
# does and needs no codec.
gif = "0.14"
cpal = "0.15"
# Release tuning, added on measurement rather than habit. The gain is `--release`
# itself: at 3000 bodies the simulation runs about ten times faster than debug (1.7 ms
# per 1/60 s step, against 17.3 ms). What did *not* help, measured on that workload
# here: thin LTO with `codegen-units = 1` (2.35 s -> 2.39 s — the hot loop lives inside
# one crate and is already monomorphised and inlined at opt-level 3, and the renderer is
# Metal rather than our own code), and `-C target-cpu=native` (no gain here, and it makes
# the binary unportable across the three targets the release workflow builds).
#
# `strip` is the one change that does something: measured here, 13.5 -> 10.6 MB for the
# app and 11.6 -> 9.2 MB for the probe. (Thin LTO on top trims another ~1 MB, for a
# rebuild of every dependency each time the profile moves, and no measurable speed.) It costs
# symbolised backtraces — panic *messages* are string literals and survive, so it is
# `RUST_BACKTRACE=1` that turns into addresses rather than names. `panic` is left at the
# default `unwind` on purpose: a panicking conversion worker shows up as a dead channel
# and one panel line, and aborting would take the window with it.
[profile.release]
strip = true
